name: NyerahLocal
options:
  bundleIdPrefix: com.nyerahworks
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    exactVersion: 3.31.4
  SwiftHuggingFace:
    url: https://github.com/huggingface/swift-huggingface
    from: 0.9.0
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.0

targets:
  NyerahLocal:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NyerahLocal
        excludes:
          - Support/Info.plist
          - Support/NyerahLocal.entitlements
    info:
      path: NyerahLocal/Support/Info.plist
      properties:
        CFBundleDisplayName: NyerahLocal
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSupportsIndirectInputEvents: true
    entitlements:
      path: NyerahLocal/Support/NyerahLocal.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
    dependencies:
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: MLXSwiftLM
        product: MLXHuggingFace
      - package: SwiftHuggingFace
        product: HuggingFace
      - package: SwiftTransformers
        product: Tokenizers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nyerahworks.NyerahLocal
        PRODUCT_NAME: NyerahLocal
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: NyerahLocal/Support/NyerahLocal.entitlements
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"

schemes:
  NyerahLocal:
    build:
      targets:
        NyerahLocal: all
    run:
      config: Debug
    archive:
      config: Release
