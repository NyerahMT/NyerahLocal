name: Build iOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve packages
        run: |
          xcodebuild \
            -project NyerahLocal.xcodeproj \
            -scheme NyerahLocal \
            -resolvePackageDependencies \
            -skipMacroValidation

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project NyerahLocal.xcodeproj \
            -scheme NyerahLocal \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            -skipMacroValidation \
            build
